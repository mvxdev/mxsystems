    .top .mark { height: 38px; width: auto; align-self: center; }
    .top { font-style: italic; }
    .top .tag { margin-left: auto; font: 400 15px/1 "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: #8e8678; }
    h1 { align-self: center; margin: 0; max-width: 1000px; font: 500 74px/1 "Cormorant Garamond", serif; letter-spacing: -.02em; }
    h1 em { font-style: italic; color: #ff5f1f; }
    .bottom { display: flex; justify-content: space-between; padding-top: 22px; border-top: 1px solid #ece5d8; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: #8e8678; }
