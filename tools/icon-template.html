<!doctype html>
<!--
  Шаблон иконки для iPhone/iPad («apple-touch-icon», 180×180) — её показывает iOS,
  когда сайт добавляют на экран «Домой». iOS сам скругляет углы, поэтому квадрат без скругления.
  PNG делает tools/build_images.ps1.
-->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; background: #0d0c0a; }
    svg { display: block; width: 180px; height: 180px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 64 64" fill="none" stroke="#ece5d8" stroke-width="2.6" stroke-linecap="square">
    <g transform="translate(6.4 6.4) scale(.8)">
      <path d="M12 44V20l10.5 14L33 20v24M38 20l14 24M38 44l11.5-19.5"/>
      <circle cx="51.5" cy="21" r="4" fill="#ff5f1f" stroke="none"/>
    </g>
  </svg>
</body>
</html>
