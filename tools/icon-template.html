<!doctype html>
<!--
  Шаблон иконки для iPhone/iPad («apple-touch-icon», 180×180) — её показывает iOS,
  когда сайт добавляют на экран «Домой». Берём тот же знак, что у favicon (assets/favicon.svg).
  PNG делает tools/build_images.ps1.
-->
<html>
<head>
  <meta charset="utf-8">
  <style>html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; background: #0d0c0a; } img { display: block; width: 180px; height: 180px; }</style>
</head>
<body><img src="../assets/favicon.svg" alt=""></body>
</html>
