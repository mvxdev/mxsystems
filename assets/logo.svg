<!-- Логотип MX Systems — монограмма (знак).
     Идея: «MX» тонкими линиями, как провода на схеме сайта; на конце одной линии X —
     оранжевая точка-«импульс» (данные пошли). Круг вокруг — печать издательства, в тон обложке.
     Нарисован путями (path), без шрифта — поэтому одинаково выглядит везде.
     currentColor — цвет линий берётся из CSS (цвета текста), точка всегда оранжевая. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter">
  <circle cx="32" cy="32" r="30" stroke-width="1.6"/>
  <!-- M -->
  <path d="M13.5 43 V21 L23.5 34 L33.5 21 V43"/>
  <!-- X: первая линия обычная, вторая заканчивается точкой-импульсом -->
  <path d="M38 21 L51 43"/>
  <path d="M38 43 L49 24.5"/>
  <circle cx="50.6" cy="21.8" r="3.2" fill="#ff5f1f" stroke="none"/>
</svg>
