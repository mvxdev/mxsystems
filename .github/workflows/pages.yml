# Автопубликация сайта на GitHub Pages (GitHub Actions) — версия для Astro.
# Что делает при каждой отправке (git push) в ветку main:
#   1. build  — ставит зависимости, собирает сайт Astro в dist/ (официальное действие withastro/action,
#               оно же загружает dist/ как «артефакт» для Pages);
#   2. проверяет SEO собранного сайта (tools/seo_check.py). Есть хоть одна ошибка — публикации НЕ будет;
#   3. deploy — выкладывает собранный сайт.
# В публикацию попадает только dist/: исходники, concepts/, tools/, archive/ и docs/ остаются в репозитории.

name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:          # кнопка «Run workflow» — запустить публикацию вручную

# Права, которые нужны для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Если пришло новое изменение, пока старое ещё публикуется, — старое отменяем
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4

      - name: Собрать сайт Astro и подготовить к публикации
        uses: withastro/action@v3
        with:
          node-version: 24

      - name: SEO-проверка собранного сайта (ошибка = публикации не будет)
        run: python3 tools/seo_check.py dist

  deploy:
    needs: build                # выкладываем, только если сборка и SEO-проверка прошли
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
