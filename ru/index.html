<!doctype html>
<!--
  /ru/ — короткая страница-перенаправление на главную «/» (русская версия живёт в корне).
  Зачем: если кто-то откроет mxsystems.md/ru/, он попадёт на основную страницу,
  а поисковики не увидят дубль — canonical указывает на «/».
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MX Systems</title>
  <!-- canonical — «главный» адрес: поисковик засчитает эту страницу как «/» -->
  <link rel="canonical" href="https://mxsystems.md/">
  <!-- noindex — не добавлять /ru/ в поиск отдельно -->
  <meta name="robots" content="noindex">
  <!-- meta refresh — перенаправление без JS через 0 секунд -->
  <meta http-equiv="refresh" content="0; url=../">
  <!-- Запоминаем, что посетитель выбрал русский, чтобы автоопределение языка не увело его на /ro/ или /en/ -->
  <script src="../assets/js/ru-redirect.js"></script>
</head>
<body>
  <p><a href="../">MX Systems — перейти на главную</a></p>
</body>
</html>
